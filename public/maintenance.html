<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CashCanvas — Back Soon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fbf9f6;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #1b1c1a;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(27, 28, 26, 0.08);
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .logo {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 28px;
      color: #005235;
      margin-bottom: 32px;
    }

    .icon {
      width: 56px;
      height: 56px;
      background: #e8f3ed;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .icon svg {
      width: 28px;
      height: 28px;
      stroke: #005235;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 22px;
      font-weight: 600;
      color: #1b1c1a;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: #3f4943;
      line-height: 1.7;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #005235;
      border-radius: 2px;
      margin: 28px auto;
      opacity: 0.3;
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #9aa59e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">CashCanvas</div>

    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
    </div>

    <h1>We'll be right back</h1>
    <p>CashCanvas is down for a quick update.<br>Check back soon — we won't be long.</p>

    <div class="divider"></div>
    <p style="font-size:13px;color:#6f7a72;">Your data is safe and will be right here when we return.</p>
  </div>

  <div class="footer">© 2026 CashCanvas</div>
</body>
</html>
